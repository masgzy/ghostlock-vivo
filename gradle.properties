android.useAndroidX=true
android.nonTransitiveRClass=true
android.r8.gradual.support=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true

# Exponential-backoff retries for repository transport errors (429/5xx):
# Sonatype's CDN throttles shared datacenter IPs; without retries a single
# rate-limit reply fails the whole dependency resolution.
org.gradle.internal.repository.max.tentatives=6
org.gradle.internal.repository.initial.backoff=2500
